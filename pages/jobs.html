<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saxum | Careers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .form-control::placeholder, .form-select::placeholder {
            color: #6c757d !important;
            opacity: 1;
        }
    </style>
</head>

<body class="bg-dark text-light d-flex flex-column min-vh-100">
    <section class="container my-5" style="max-width: 600px;">

        <div class="mb-4">
            <img src="../assets/saxum_logo.svg" alt="Logo Saxum" class="img-fluid d-block mx-auto" style="max-width: 200px;">
        </div>

        <div class="text-center mb-5">
            <p class="text-secondary small">Compila il modulo per inviare la tua candidatura o proposta di collaborazione.</p>
        </div>

        <div id="successBox" class="alert alert-danger d-none text-center mb-4 border-0" role="alert">
            La tua candidatura è stata inviata! I tuoi dati verranno gestiti secondo il <a href="privacy.html" class="alert-link text-secondary text-decoration-underline">trattamento dei dati</a>.
        </div>

        <!-- Modulo -->
        <form id="candidaturaForm" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="1143c03c-1439-4ca7-b0de-466229815da0">

            <!-- Nome e Cognome -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="nome" class="form-label text-secondary small">Nome *</label>
                    <input type="text" name="nome" class="form-control bg-dark text-light border-secondary" id="nome" placeholder="Il tuo nome" required>
                </div>
                <div class="col-md-6">
                    <label for="cognome" class="form-label text-secondary small">Cognome *</label>
                    <input type="text" name="cognome" class="form-control bg-dark text-light border-secondary" id="cognome" placeholder="Il tuo cognome" required>
                </div>
            </div>

            <!-- Sesso e Ruolo -->
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label for="sesso" class="form-label text-secondary small">Sesso</label>
                    <select name="sesso" class="form-select bg-dark text-light border-secondary" id="sesso">
                        <option value="" selected disabled>Seleziona</option>
                        <option value="M">M</option>
                        <option value="F">F</option>
                    </select>
                </div>
                <div class="col-md-8">
                    <label for="ruolo" class="form-label text-secondary small">Profilo / Ruolo *</label>
                    <select name="ruolo" class="form-select bg-dark text-light border-secondary" id="ruolo" required>
                        <option value="" selected disabled>Seleziona il tuo ruolo</option>
                        <option value="dj">DJ</option>
                        <option value="vocalist">Vocalist</option>
                        <option value="immagine">Ragazza/o Immagine</option>
                        <option value="smm">SMM/Content Creator</option>
                        <option value="sassofonista">Sassofonista</option>
                    </select>
                </div>
            </div>

            <!-- Provincia e Comune -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="provincia" class="form-label text-secondary small">Provincia *</label>
                    <select name="provincia" class="form-select bg-dark text-light border-secondary" id="provincia" required>
                        <option value="" selected disabled>Seleziona provincia</option>
                        <option value="Teramo">Teramo</option>
                        <option value="L'Aquila">L'Aquila</option>
                        <option value="Pescara">Pescara</option>
                        <option value="Chieti">Chieti</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="comune" class="form-label text-secondary small">Comune *</label>
                    <input type="text" name="comune" class="form-control bg-dark text-light border-secondary" id="comune" placeholder="Es. Roseto degli Abruzzi" required>
                </div>
            </div>

            <!-- Email e Telefono -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="email" class="form-label text-secondary small">Email *</label>
                    <input type="email" name="email" class="form-control bg-dark text-light border-secondary" id="email"
                        placeholder="nome@esempio.it" required>
                </div>
                <div class="col-md-6">
                    <label for="telefono" class="form-label text-secondary small">Numero di Telefono *</label>
                    <input type="tel" name="telefono" class="form-control bg-dark text-light border-secondary" id="telefono"
                        placeholder="+39 ..." required>
                </div>
            </div>

            <!-- Social Links (Instagram e TikTok obbligatori) -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="instagram" class="form-label text-secondary small">Profilo Instagram *</label>
                    <input type="url" name="instagram" class="form-control bg-dark text-light border-secondary" id="instagram"
                        placeholder="https://instagram.com/tuonome" required>
                </div>
                <div class="col-md-6">
                    <label for="tiktok" class="form-label text-secondary small">Profilo TikTok *</label>
                    <input type="url" name="tiktok" class="form-control bg-dark text-light border-secondary" id="tiktok"
                        placeholder="https://tiktok.com/@tuonome" required>
                </div>
            </div>

            <!-- Link CV (Opzionale) -->
            <div class="mb-3">
                <label for="cv" class="form-label text-secondary small">Link CV / Portfolio <span
                        class="text-muted">(Opzionale)</span></label>
                <input type="url" name="cv" class="form-control bg-dark text-light border-secondary" id="cv"
                    placeholder="https://drive.google.com/... o LinkedIn">
            </div>

            <!-- Raccontaci di te (Minimo 50 caratteri) -->
            <div class="mb-4">
                <label for="bio" class="form-label text-secondary small">Raccontaci di te * <span class="text-muted">(min. 50 caratteri)</span></label>
                <textarea name="bio" class="form-control bg-dark text-light border-secondary" id="bio" rows="4" placeholder="Parlaci delle tue esperienze, genere musicale preferito o progetti..." minlength="50" required></textarea>
            </div>

            <div class="text-center mb-3">
                <button type="submit" class="btn btn-outline-light px-5 py-2 fw-bold text-uppercase w-100">Invia Candidatura</button>
            </div>

        </form>

        <div class="text-center">
            <a href="../index.html" class="btn btn-dark text-secondary border border-secondary px-4 py-2 small text-uppercase text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>Torna alla Home
            </a>
        </div>

    </section>

<!-- Script per invio asincrono corretto con Web3Forms -->
    <script>
        const form = document.getElementById('candidaturaForm');
        const successBox = document.getElementById('successBox');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validazione sul testo della bio (min 50 caratteri)
            const bioText = document.getElementById('bio').value;
            if (bioText.trim().length < 50) {
                alert("Il campo 'Raccontaci di te' deve contenere almeno 50 caratteri.");
                return;
            }

            // Disattiva tutti i campi e il pulsante per evitare spam
            const inputs = form.querySelectorAll('input, select, textarea, button');
            inputs.forEach(input => input.disabled = true);

            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.innerHTML = 'Invio in corso...';

            // Raccoglie automaticamente tutti i dati del form
            const formData = new FormData(form);
            
            // Forza l'aggiunta esplicita dell'access_key per evitare l'errore 400
            formData.append('access_key', '1143c03c-1439-4ca7-b0de-466229815da0');

            // Invia i dati a Web3Forms
            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: formData
            })
            .then(async (response) => {
                let jsonResponse = await response.json();
                if (response.status == 200 && jsonResponse.success) {
                    form.reset();
                    submitBtn.innerHTML = 'Inviato!';
                    successBox.classList.remove('d-none');
                } else {
                    console.log(jsonResponse);
                    alert("Errore nell'invio: " + (jsonResponse.message || "Riprova."));
                    inputs.forEach(input => input.disabled = false);
                    submitBtn.innerHTML = 'Invia Candidatura';
                }
            })
            .catch(error => {
                console.log(error);
                alert("Errore di connessione. Riprova.");
                inputs.forEach(input => input.disabled = false);
                submitBtn.innerHTML = 'Invia Candidatura';
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc559fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
